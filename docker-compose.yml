services:

  mongodb:
    image: mongo:7
    container_name: officyna-users-service-mongodb
    environment:
      MONGO_INITDB_DATABASE: officyna-users
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo_users_data:/data/db
      - ./db-seed:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [ "CMD", "mongosh", "--eval", "db.adminCommand('ping')" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - officyna-network

  mongo-express:
    image: mongo-express:1.0.2
    container_name: officyna-users-service-mongo-express
    environment:
      ME_CONFIG_MONGODB_SERVER: mongodb
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: admin
    ports:
      - "127.0.0.1:8081:8081"
    depends_on:
      mongodb:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - officyna-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: officyna-users-service-app
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      SERVER_PORT: 8083
      MONGODB_URI: mongodb://mongodb:27017/officyna-users
      JWT_SECRET: officyna-secret-key-change-in-production-min-256bits
      JWT_EXPIRATION: 86400000
      DATABASE_SEED_ENABLED: "true"
      SPRING_PROFILES_ACTIVE: default
    ports:
      - "8083:8083"
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:8083/actuator/health || exit 1" ]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3
    restart: unless-stopped
    networks:
      - officyna-network

volumes:
  mongo_users_data:

networks:
  officyna-network:
    driver: bridge

