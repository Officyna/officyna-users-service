apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: officyna-users-service
  labels:
    app.kubernetes.io/name: officyna-users
  namespace: officyna
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: officyna-users-service
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Pods
          value: 2
          periodSeconds: 30
    scaleDown:
      stabilizationWindowSeconds: 120
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60

