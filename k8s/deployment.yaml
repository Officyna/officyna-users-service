apiVersion: apps/v1
kind: Deployment
metadata:
  name: officyna-users-service
  labels:
    app.kubernetes.io/name: officyna-users
    app.kubernetes.io/component: api
  namespace: officyna
spec:
  replicas: 1
  # Encerra o pod antigo antes de subir o novo: evita que o rollout fique
  # travado em Pending quando o nó não tem CPU/memória para dois pods simultâneos.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: officyna-users
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: officyna-users
        app.kubernetes.io/component: api
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: officyna-users-service
          image: ghcr.io/officyna/officyna-users-service:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: officyna-users-configmap
            - secretRef:
                name: officyna-users-secret
          resources:
            requests:
              cpu: "100m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "768Mi"
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            failureThreshold: 40
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 15
            failureThreshold: 3

